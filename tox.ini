[tox]
env_list =
    format
    lint
    type
    py{310,312,314}

[testenv:format]
description = use ruff for formatting in a virtual environment
deps = ruff
commands = ruff format {posargs:.}

[testenv:lint]
description = run ruff checks on codebase
deps =
    ruff
    pytest>=7
    pytest-asyncio
commands = ruff check --fix {posargs:src tests examples}

[testenv:type]
description = run type checks on src
deps = ty
commands = ty check {posargs:src}

[testenv]
description = install pytest in a virtual environment and invoke it on the tests folder
deps =
    pytest>=7
    pytest-asyncio
    pytest-sugar
    pytest-xdist
    coverage
extras = dev
setenv =
    COVERAGE_PROCESS_START = {toxinidir}/pyproject.toml
commands = coverage erase
           coverage run -m pytest tests -n auto {posargs}
           coverage combine
           coverage report --include="src/*" --omit="*test*"
