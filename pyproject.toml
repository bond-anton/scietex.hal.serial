[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scietex.hal.serial"
dynamic = ["version"]
description = "Scietex Serial Communication Library"
authors = [{ name = "Anton Bondarenko", email = "bond.anton@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
]
requires-python = ">=3.10"
dependencies = ["pymodbus[serial] ~= 3.12"]

[project.urls]
"Homepage" = "https://github.com/bond-anton/scietex.hal.serial"
"Bug Tracker" = "https://github.com/bond-anton/scietex.hal.serial/issues"

[project.optional-dependencies]
dev = ["tox>=4.46.0"]
test = [
    "flake8",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout>=2.4.0",
]
lint = ["pylint"]
all = ["scietex.hal.serial[dev,test,lint]"]

[tool.setuptools.dynamic]
version = { attr = "scietex.hal.serial.version.__version__" }

[tool.setuptools.package-data]
"scietex.hal.serial" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
