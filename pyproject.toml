[project]
name = "scietex.hal.serial"
description = "Scietex Serial Communication Library"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
authors = [{ name = "Anton Bondarenko", email = "bond.anton@gmail.com" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
]
dependencies = ["pymodbus[serial] ~= 3.15"]
dynamic = ["version"]

[project.urls]
"Bug Tracker" = "https://github.com/bond-anton/scietex.hal.serial/issues"
"Homepage" = "https://github.com/bond-anton/scietex.hal.serial"

[project.optional-dependencies]
all = ["scietex.hal.serial[dev,test,lint,docs]"]
dev = ["tox>=4.46.0"]
lint = ["ruff", "ty"]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout>=2.4.0",
  "pytest-xdist",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.coverage.run]
source = ["src"]
concurrency = ["multiprocessing"]
parallel = true

[tool.setuptools.dynamic]
version = { attr = "scietex.hal.serial.version.__version__" }

[tool.setuptools.package-data]
"scietex.hal.serial" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
