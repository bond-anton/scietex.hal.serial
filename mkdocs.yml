site_name: scietex.hal.serial
site_description: Serial/Modbus (RS485) communication library with a virtual serial network and a serial-to-TCP Modbus gateway.
site_url: https://scietex-hal-serial.readthedocs.io/
repo_url: https://github.com/bond-anton/scietex.hal.serial
repo_name: bond-anton/scietex.hal.serial
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - User Guide:
      - Configuration: guide/configuration.md
      - Virtual Serial Network: guide/virtual.md
      - Modbus Server: guide/server.md
      - Modbus Client: guide/client.md
      - Modbus Gateway: guide/gateway.md
      - Upgrading to 2.0: guide/upgrading.md
  - API Reference:
      - Overview: api/index.md
      - Configuration: api/config.md
      - Virtual: api/virtual.md
      - Server: api/server.md
      - Client: api/client.md
      - Gateway: api/gateway.md
      - Utilities: api/utilities.md
  - Architecture:
      - Overview: architecture/README.md
      - Subsystems: architecture/overview.md
      - Structure: architecture/structure.md
      - Components: architecture/components.md
      - Dependencies: architecture/dependencies.md
      - Data Flow: architecture/data-flow.md
      - Lifecycle: architecture/lifecycle.md
      - Hotspots: architecture/hotspots.md
  - Design:
      - Modbus Gateway: design/modbus-gateway.md
      - Non-Standard Protocols: design/modbus-gateway-nonstandard.md
  - Reviews:
      - Architecture Review (2025-09-30): reviews/architecture/2025-09-30-001.md
